<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match Score Submission</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #666;
      font-weight: bold;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Match Score Submission</h2>
    <form id="scoreForm">
      <div class="form-group">
        <label for="matchId">Match ID:</label>
        <input type="text" id="matchId" name="matchId" readonly required>
      </div>
      <div class="form-group">
        <label for="winner">Winner Name:</label>
        <input type="text" id="winner" name="winner" required placeholder="Enter winner name">
      </div>
      <button type="submit">Submit Result</button>
    </form>
    <div id="message"></div>
  </div>

  <script>
    const scriptUrl = 'https://script.google.com/macros/s/AKfycbwHNWPhIB7RKMpFQrzb5DLqlsBXf_Mb6dgh8Fjb8B7yRd906omOtjEw6AXBRJaREwL6XQ/exec';
    const tabletId = 4; // Set this tablet's ID

    // Fetch assigned match on page load
    window.onload = function() {
      fetch(scriptUrl + '?tabletId=' + tabletId)
        .then(response => response.json())
        .then(data => {
          if (data && data.length > 0) {
            // Pre-fill the form with the assigned match details
            document.getElementById('matchId').value = data[0]['Match ID'];
          } else {
            document.getElementById('message').textContent = 'No match assigned to this tablet.';
          }
        })
        .catch(error => {
          console.error('Error fetching assigned match:', error);
          document.getElementById('message').textContent = 'Error loading assigned match.';
        });
    };

    // Handle form submission back to the Apps Script
    document.getElementById('scoreForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const matchId = document.getElementById('matchId').value;
      const winner = document.getElementById('winner').value;
      const messageDiv = document.getElementById('message');

      const payload = {
        tabletId: tabletId,
        matchId: matchId,
        winner: winner
      };

      messageDiv.textContent = 'Submitting...';
      messageDiv.style.color = '#007BFF';

      fetch(scriptUrl, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(response => response.json())
      .then(data => {
        if(data.status === 'success') {
          messageDiv.textContent = 'Result submitted successfully!';
          messageDiv.style.color = 'green';
          document.getElementById('scoreForm').reset();
        } else {
          messageDiv.textContent = 'Error: ' + (data.message || 'Submission failed.');
          messageDiv.style.color = 'red';
        }
      })
      .catch(error => {
        console.error('Error:', error);
        messageDiv.textContent = 'Network error occurred.';
        messageDiv.style.color = 'red';
      });
    });
  </script>

</body>
</html>
